name: HeadLink
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: zh-Hans
  xcodeVersion: '26.1.1'
packages:
  HeadLink:
    path: .
  OpenCine:
    path: Vendor/OpenCine
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: 1.2.2
    CURRENT_PROJECT_VERSION: 1
targets:
  HeadLink:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: HeadLink
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMotionUsageDescription: 使用耳机的头部姿态，计算你校准后的镜头方向；数据只在本机处理。
        NSBluetoothAlwaysUsageDescription: 查找并配对你自己的 Pocket 相机。
        NSLocalNetworkUsageDescription: 通过相机 Wi-Fi 接收实时画面、读取状态并发送控制命令。
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.headlink.personal
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: HeadLink
        product: HeadLinkCore
      - package: OpenCine
        product: OpenCineDJI
      - package: OpenCine
        product: OpenCineDJIApple
      - package: OpenCine
        product: OpenCineMotion
      - package: OpenCine
        product: OpenCineApple
  HeadLinkSmoke:
    type: application
    platform: iOS
    sources: [Smoke]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.headlink.smoke
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  HeadLinkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: HeadLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.headlink.ui-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HeadLink
schemes:
  HeadLink:
    build:
      targets:
        HeadLink: all
  HeadLinkSmoke:
    build:
      targets:
        HeadLinkSmoke: all
  HeadLinkUIReview:
    build:
      targets:
        HeadLink: all
        HeadLinkUITests: [test]
    test:
      targets: [HeadLinkUITests]
